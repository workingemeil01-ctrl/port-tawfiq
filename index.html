<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>شاليها بورتوفيق</title>

  <!-- خط رقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- خلفية ألوان متغيّرة (بتغطي أي فراغات فوق/تحت) -->
  <div class="ambient" aria-hidden="true"></div>

  <div class="app" id="app">
    <header class="topbar" aria-label="القائمة العلوية">
      <nav class="nav" role="tablist" aria-label="التنقل">
        <span class="nav-indicator" aria-hidden="true"></span>

        <button class="nav-btn is-active" role="tab" aria-selected="true" data-target="home" type="button">الرئيسية</button>
        <button class="nav-btn" role="tab" aria-selected="false" data-target="prices" type="button">الأسعار</button>
        <button class="nav-btn" role="tab" aria-selected="false" data-target="stay" type="button">تفاصيل الإقامة</button>
        <button class="nav-btn" role="tab" aria-selected="false" data-target="booking" type="button">التوافر والحجز</button>
      </nav>
    </header>

    <main class="main">
      <!-- HOME -->
      <section class="screen is-visible" id="home" aria-label="الرئيسية">
        <div class="hero">
          <!-- فيديو: هيتحدد تلقائيًا من JS بأكتر من امتداد -->
          <video
            id="heroVideo"
            class="hero-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            data-asset="bck1"
          ></video>

          <div class="hero-overlay" aria-hidden="true"></div>

          <div class="hero-center">
            <div class="glass-title">
              <h1 class="hero-title" data-text="شاليها بورتوفيق">شاليها بورتوفيق</h1>
              <div class="title-shine" aria-hidden="true"></div>
            </div>
          </div>

          <div class="hero-footer" aria-label="شعار">
            <!-- اللوجو: هيتحدد تلقائيًا من JS بأكتر من امتداد -->
            <img id="brandLogo" class="brand" data-asset="seuz" alt="seuz" />
          </div>
        </div>
      </section>

      <!-- PRICES -->
      <section class="screen" id="prices" aria-label="الأسعار">
        <div class="panel">
          <h2 class="panel-title">الأسعار</h2>
          <div class="panel-body placeholder"></div>
        </div>
      </section>

      <!-- STAY -->
      <section class="screen" id="stay" aria-label="تفاصيل الإقامة">
        <div class="panel">
          <h2 class="panel-title">تفاصيل الإقامة</h2>
          <div class="panel-body placeholder"></div>
        </div>
      </section>

      <!-- BOOKING -->
      <section class="screen" id="booking" aria-label="التوافر والحجز">
        <div class="panel">
          <h2 class="panel-title">التوافر والحجز</h2>
          <div class="panel-body placeholder"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
